      (function () {
        try {
          var raw = localStorage.getItem('maple-theme');
          if (!raw) return;
          var theme = JSON.parse(raw).state && JSON.parse(raw).state.theme;
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
